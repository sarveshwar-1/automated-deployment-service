services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: ads-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ads-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for BullMQ job queues
  redis:
    image: redis:7-alpine
    container_name: ads-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - ads-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: ads-minio
    ports:
      - "9010:9000"
      - "9011:9001" # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - ads-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: ads-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/source-code --ignore-existing;
      mc mb myminio/static-builds --ignore-existing;
      mc anonymous set download myminio/static-builds;
      echo 'Buckets created successfully';
      exit 0;
      "
    networks:
      - ads-network

  # Kafka Message Broker
  kafka:
    image: apache/kafka:latest
    container_name: ads-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=INTERNAL://:29092,REMOTE://:9094,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,REMOTE://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,REMOTE:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ads-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Kafka UI for monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ads-kafka-ui
    ports:
      - "8091:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      - kafka
    networks:
      - ads-network
    restart: unless-stopped

  # Upload Service - Express API (port 3002)
  upload-service:
    build:
      context: ./upload-service
      dockerfile: Dockerfile
    container_name: ads-upload-service
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/automated-deployment
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_USE_SSL=false
      - JWT_SECRET=ILoveKiaraAdvani
      - GITHUB_CLIENT_ID=Ov23lizLiwJ3aUUXKItr
      - GITHUB_CLIENT_SECRET=f17e7703294f349a1af705d3b6ee2b92e92687aa
      - GITHUB_CALLBACK_URL=http://localhost:5173/auth/github/callback
    volumes:
      - upload_temp:/tmp
      - git_mirrors:/app/src/gitBare
      - rsa_keys:/app/keys
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - ads-network
    restart: unless-stopped

  # Upload Service Worker - Processes deployment jobs
  upload-worker:
    build:
      context: ./upload-service
      dockerfile: Dockerfile
    container_name: ads-upload-worker
    command: ["node", "dist/worker.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/automated-deployment
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_USE_SSL=false
    volumes:
      - upload_temp:/tmp
      - git_mirrors:/app/src/gitBare
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - ads-network
    restart: unless-stopped

  # Upload Service Daemon - Checks for new commits
  upload-daemon:
    build:
      context: ./upload-service
      dockerfile: Dockerfile
    container_name: ads-upload-daemon
    command: ["node", "dist/daemon.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/automated-deployment
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_USE_SSL=false
    volumes:
      - git_mirrors:/app/src/gitBare
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ads-network
    restart: unless-stopped

  # Build Service Worker - Builds projects and serves static files
  build-service:
    build:
      context: ./build-service
      dockerfile: Dockerfile
    container_name: ads-build-service
    ports:
      - "3001:3001" # Static file server
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/automated-deployment
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_USE_SSL=false
      - PORT=3001
      - KAFKA_BROKER=kafka:29092
    volumes:
      - build_temp:/tmp
      - ./access.log:/app/access.log:ro
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - ads-network
    restart: unless-stopped

  # Frontend - React/Vite
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://${SERVER_IP:-localhost}:${UPLOAD_SERVICE_PORT:-3002}
        - VITE_BUILD_SERVICE_URL=http://${SERVER_IP:-localhost}:${BUILD_SERVICE_PORT:-3001}
    container_name: ads-frontend
    ports:
      - "5173:80"
    depends_on:
      - upload-service
      - build-service
    networks:
      - ads-network
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  minio_data:
  upload_temp:
  build_temp:
  git_mirrors:
  kafka_data:
  rsa_keys:

networks:
  ads-network:
    driver: bridge
