# NGINX configuration for host-service with Lua-based dynamic routing
# Routes requests to per-project servers based on port registry

# Load Lua modules
lua_package_path "/etc/nginx/lua/?.lua;;";
lua_shared_dict port_cache 10m;
lua_shared_dict traffic_stats 50m;

server {
    listen 3001;
    server_name _;

    # Health check endpoint
    location /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"host-service-nginx"}';
    }

    # API endpoints for host-service management (proxied to Node.js)
    # Using ^~ to give this priority over the regex location below
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Build-service API (proxied through host-service)
    location ^~ /build-api/ {
        proxy_pass http://build-service:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Dynamic routing for project requests
    # Matches: /{projectId} or /{projectId}/path/to/file
    location ~ ^/(?<project_id>[a-zA-Z0-9_-]+)(?<path_remainder>/.*)?$ {
        set $backend_port "";

        # Lua script determines the correct backend port
        access_by_lua_file /etc/nginx/lua/route.lua;

        # Track traffic for this endpoint
        log_by_lua_file /etc/nginx/lua/traffic.lua;

        # Rewrite to strip project ID prefix: /projectId/path -> /path
        # The path_remainder already has the leading slash
        set $proxy_path $path_remainder;
        if ($proxy_path = "") {
            set $proxy_path "/";
        }

        # Proxy to the project's server with the stripped path
        proxy_pass http://127.0.0.1:$backend_port$proxy_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Project-Id $project_id;
        proxy_set_header X-Original-URI $request_uri;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Error handling
        proxy_intercept_errors on;
        error_page 502 503 504 = @project_unavailable;
    }

    # Fallback when project server is unavailable
    location @project_unavailable {
        default_type text/html;
        return 503 '<!DOCTYPE html>
<html>
<head><title>Project Unavailable</title></head>
<body style="font-family: sans-serif; text-align: center; padding: 50px;">
<h1>Project Temporarily Unavailable</h1>
<p>The project server is starting or not available. Please try again in a few seconds.</p>
</body>
</html>';
    }

    # Root - show welcome message
    location = / {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html>
<head><title>Host Service</title></head>
<body style="font-family: sans-serif; text-align: center; padding: 50px; background: #0d1117; color: #c9d1d9;">
<h1 style="color: #58a6ff;">Host Service</h1>
<p>Access deployed projects at: <code>/{projectId}/</code></p>
</body>
</html>';
    }
}
