# Security Headers Configuration
# Course Relevance: CO4 - Web Security, Network Security

# Prevent clickjacking attacks
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# XSS Protection (legacy browsers)
add_header X-XSS-Protection "1; mode=block" always;

# Referrer Policy - don't leak referrer to external sites
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy (CSP) - prevent XSS and injection attacks
# Customize this based on your application's needs
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:3000 http://localhost:3001; frame-ancestors 'self';" always;

# HSTS - Force HTTPS (enable in production with valid SSL)
# Uncomment in production:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Permissions Policy - control browser features
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# Cross-Origin Policies
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
